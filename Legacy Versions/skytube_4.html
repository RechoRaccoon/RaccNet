  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #0f0f0f; color: #f1f1f1; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
  /* Chrome scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
  /* Firefox scrollbars */
  * { scrollbar-width: thin; scrollbar-color: #3f3f3f transparent; }
  /* Shimmer */
  @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .skt-shimmer { animation: shimmer 1.5s ease-in-out infinite; }
  /* Line clamp */
  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-height: 2.8em;
    line-height: 1.4em;
  }
  /* Remove Firefox default button/input appearance */
  button { -moz-appearance: none; cursor: pointer; }
  input  { -moz-appearance: none; }
  a { color: inherit; text-decoration: none; }
  button:focus, input:focus, video:focus { outline: none; }

const { useState, useEffect, useRef, useCallback } = React;

const PUB  = "https://public.api.bsky.app/xrpc";
const AUTH = "https://bsky.social/xrpc";

// All API calls go through this wrapper so Firefox file:// origins work.
// Sending credentials: "omit" is mandatory when server uses Access-Control-Allow-Origin: *
// otherwise Firefox blocks the response with a CORS error.
const apiFetch = async (url, opts = {}) => {
  const headers = Object.assign({ "Accept": "application/json" }, opts.headers || {});
  const options = Object.assign({}, opts, { credentials: "omit", headers });
  try {
    return await fetch(url, options);
  } catch (err) {
    err._isNetworkBlock = true;
    throw err;
  }
};
const isETPBlock = (err) => !!(err && (err._isNetworkBlock || (err instanceof TypeError && /NetworkError|Failed to fetch|Load failed/i.test(err.message))));

const isVid = (p) => p?.embed?.$type === "app.bsky.embed.video#view";

const ago = (d) => {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  if (s < 2592000) return `${Math.floor(s / 86400)}d ago`;
  if (s < 31536000) return `${Math.floor(s / 2592000)} months ago`;
  return `${Math.floor(s / 31536000)} years ago`;
};

const fmt = (n) => {
  if (!n) return "0";
  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return "" + n;
};

// ── Video Player ───────────────────────────────────────────────────────────────
function VideoPlayer({ playlist, thumbnail }) {
  const ref = useRef();
  const hlsRef = useRef();
  const scriptLoaded = useRef(false);

  useEffect(() => {
    if (!playlist || !ref.current) return;

    const initHls = () => {
      if (hlsRef.current) { hlsRef.current.destroy(); hlsRef.current = null; }
      if (window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({ enableWorker: false, lowLatencyMode: false, backBufferLength: 90 });
        hlsRef.current = hls;
        hls.loadSource(playlist);
        hls.attachMedia(ref.current);
        hls.on(window.Hls.Events.MANIFEST_PARSED, () => { ref.current && ref.current.play().catch(() => {}); });
        hls.on(window.Hls.Events.ERROR, (_, data) => { if (data.fatal) ref.current.src = playlist; });
      } else if (ref.current.canPlayType("application/vnd.apple.mpegurl")) {
        ref.current.src = playlist;
        ref.current.play().catch(() => {});
      } else {
        ref.current.src = playlist;
      }
    };

    if (window.Hls) {
      initHls();
    } else if (!scriptLoaded.current) {
      scriptLoaded.current = true;
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js";
      s.crossOrigin = "anonymous";
      s.onload = initHls;
      s.onerror = () => { if (ref.current) ref.current.src = playlist; };
      document.head.appendChild(s);
    }

    return () => { hlsRef.current && hlsRef.current.destroy(); };
  }, [playlist]);

  return (
    <video
      ref={ref}
      controls
      poster={thumbnail}
      style={{ width: "100%", background: "#000", display: "block", maxHeight: "75vh", minHeight: "300px" }}
    />
  );
}

// ── Avatar ─────────────────────────────────────────────────────────────────────
function Avatar({ src, size = 36, onClick }) {
  const [err, setErr] = useState(false);
  const initials = "?";
  const s = { width: size, height: size, borderRadius: "50%", flexShrink: 0, overflow: "hidden", background: "#3f3f3f", cursor: onClick ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.4, color: "#aaa", fontWeight: 600 };
  return (
    <div style={s} onClick={onClick}>
      {src && !err
        ? <img src={src} alt="" onError={() => setErr(true)} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        : initials
      }
    </div>
  );
}

// ── Thumbnail ──────────────────────────────────────────────────────────────────
function Thumb({ src, style: extra = {} }) {
  const [err, setErr] = useState(false);
  return (
    <div style={{ width: "100%", height: "100%", ...extra, display: "flex", alignItems: "center", justifyContent: "center" }}>
      {src && !err
        ? <img src={src} alt="" onError={() => setErr(true)} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
        : <Icon.Play />
      }
    </div>
  );
}

// ── Video Card (grid) ──────────────────────────────────────────────────────────
function VideoCard({ post, onWatch, onChannel }) {
  const embed = post && post.embed;
  const author = post && post.author;
  const rec = post && post.record;
  if (!embed || embed.$type !== "app.bsky.embed.video#view") return null;

  return (
    <div style={{ cursor: "pointer" }} onClick={() => onWatch(post)}>
      <div style={{ width: "100%", paddingBottom: "56.25%", borderRadius: 12, overflow: "hidden", background: "#1a1a1a", position: "relative" }}>
        <div style={{ position: "absolute", inset: 0 }}>
          <Thumb src={embed.thumbnail} />
        </div>
      </div>
      <div style={{ display: "flex", gap: 12, paddingTop: 12 }}>
        <Avatar src={author.avatar} onClick={(e) => { e && e.stopPropagation && e.stopPropagation(); onChannel(author.handle); }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="line-clamp-2" style={{ fontSize: 14, fontWeight: 500, color: "#f1f1f1" }}>
            {(rec && rec.text) || "Untitled video"}
          </div>
          <div
            onClick={(e) => { e.stopPropagation(); onChannel(author.handle); }}
            style={{ fontSize: 13, color: "#aaa", marginTop: 4 }}
            onMouseEnter={(e) => (e.currentTarget.style.color = "#f1f1f1")}
            onMouseLeave={(e) => (e.currentTarget.style.color = "#aaa")}
          >
            {author.displayName || author.handle}

          <div style={{ fontSize: 13, color: "#aaa" }}>{fmt(post.likeCount || 0)} likes • {ago(post.indexedAt)}</div>
        </div>
      </div>
    </div>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────────

    <button

      title={!open ? label : ""}
      style={{
        display: "flex", alignItems: "center", gap: open ? 24 : 0,
        padding: open ? "10px 12px" : "18px 0", width: "100%",

        color: "#f1f1f1", borderRadius: 10,

        fontSize: 14, fontWeight: active ? 500 : 400,
        transition: "background 0.1s"

    <aside style={{

      width: open ? 240 : 72, background: "#0f0f0f",

// ── Login Modal ────────────────────────────────────────────────────────────────
function LoginModal({ onClose, onSuccess }) {
  const [handle, setHandle]   = useState("");
  const [password, setPassword] = useState("");
  const [error, setError]     = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setLoading(true); setError("");
    try {
      const res  = await apiFetch(`${AUTH}/com.atproto.server.createSession`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier: handle.trim(), password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Login failed");
      onSuccess(data);
    } catch (err) {
      setError(err.message || "An error occurred. Please try again.");
    }
    setLoading(false);
  };

  const inputStyle = {
    width: "100%", padding: "10px 14px", background: "#121212",
    border: "1px solid #3f3f3f", borderRadius: 6, color: "#f1f1f1",
    fontSize: 14, boxSizing: "border-box"
  };

  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.85)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center" }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: "#212121", borderRadius: 12, padding: 32, width: 420, maxWidth: "90vw", boxShadow: "0 8px 32px rgba(0,0,0,0.6)" }}
      >
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
          <div style={{ width: 28, height: 20, background: "#FF0000", borderRadius: 5, display: "flex", alignItems: "center", justifyContent: "center" }}>

          </div>
          <h2 style={{ color: "#f1f1f1", fontSize: 20, fontWeight: 600 }}>Sign in to SkyTube</h2>
        </div>
        <p style={{ color: "#aaa", fontSize: 13, marginBottom: 24 }}>Connect your Bluesky account for a personalized video feed.</p>

        <form onSubmit={submit}>
          <div style={{ marginBottom: 16 }}>
            <label style={{ display: "block", color: "#aaa", fontSize: 13, marginBottom: 6 }}>Handle or Email</label>
            <input
              value={handle} onChange={(e) => setHandle(e.target.value)}
              placeholder="you.bsky.social" style={inputStyle}
              onFocus={(e) => (e.target.style.borderColor = "#1c62b9")}
              onBlur={(e) => (e.target.style.borderColor = "#3f3f3f")}
            />
          </div>
          <div style={{ marginBottom: 8 }}>
            <label style={{ display: "block", color: "#aaa", fontSize: 13, marginBottom: 6 }}>App Password</label>
            <input
              value={password} onChange={(e) => setPassword(e.target.value)}
              type="password" placeholder="xxxx-xxxx-xxxx-xxxx" style={inputStyle}
              onFocus={(e) => (e.target.style.borderColor = "#1c62b9")}
              onBlur={(e) => (e.target.style.borderColor = "#3f3f3f")}
            />
          </div>
          <p style={{ color: "#aaa", fontSize: 12, marginBottom: 20 }}>
            Create an App Password at Bluesky → Settings → Privacy & Security → App Passwords
          </p>
          {error && <div style={{ color: "#ff4444", fontSize: 13, marginBottom: 12 }}>{error}</div>}
          <button
            type="submit"
            disabled={loading || !handle || !password}
            style={{
              width: "100%", padding: 12, background: "#ff0000", color: "#fff",
              border: "none", borderRadius: 6, fontSize: 15, fontWeight: 600,
              opacity: (loading || !handle || !password) ? 0.6 : 1, transition: "opacity 0.15s"
            }}
          >{loading ? "Signing in..." : "Sign In"}</button>
        </form>
      </div>
    </div>
  );
}

  const actors     = (results && results.actors)     || [];
  const totalPosts = (results && results.totalPosts) || 0;

    <div style={{ padding: 24 }}>
      <div style={{ color: "#aaa", fontSize: 14, marginBottom: 24 }}>Searching for "{query}"…</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

          <div key={i} style={{ display: "flex", gap: 12 }}>
            <div className="skt-shimmer" style={{ width: 168, height: 94, borderRadius: 8, background: "#272727", flexShrink: 0 }} />
            <div style={{ flex: 1 }}>
              <div className="skt-shimmer" style={{ height: 14, background: "#272727", borderRadius: 4, marginBottom: 8, width: "80%" }} />
              <div className="skt-shimmer" style={{ height: 12, background: "#272727", borderRadius: 4, width: "50%" }} />
            </div>
          </div>

      </div>

    <div style={{ padding: "16px 24px" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        {["All", "Channels", "Videos"].map((f) => (
          <button key={f} onClick={() => setFilter(f)} style={{
            padding: "6px 12px", borderRadius: 8, border: "1px solid #3f3f3f",
            background: filter === f ? "#f1f1f1" : "none",
            color: filter === f ? "#0f0f0f" : "#f1f1f1", fontSize: 14
          }}>{f}</button>
        ))}
      </div>

      <div style={{ color: "#aaa", fontSize: 13, marginBottom: 16 }}>
        Results for "{query}"
        {!error && results && (
          <span style={{ marginLeft: 12, color: "#555" }}>
            {actors.length} channel{actors.length !== 1 ? "s" : ""} • {videos.length} video{videos.length !== 1 ? "s" : ""}
            {totalPosts > videos.length && ` (${totalPosts} total posts, ${totalPosts - videos.length} filtered as non-video)`}
          </span>
        )}
      </div>

      {/* Error banner */}
      {error && error !== "ETP_BLOCK" && (
        <div style={{ background: "#3f0000", border: "1px solid #ff4444", borderRadius: 8, padding: "12px 16px", marginBottom: 20, color: "#ff8888", fontSize: 14 }}>
          ⚠️ {error}
        </div>
      )}
      {error === "ETP_BLOCK" && (
        <div style={{ background: "#1a1200", border: "2px solid #ffaa00", borderRadius: 12, padding: 20, marginBottom: 24, color: "#ffcc44" }}>
          <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 12 }}>🛡️ Firefox is blocking Bluesky — here's how to fix it:</div>

            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", background: "#ffaa00", color: "#000", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0, fontSize: 13 }}>1</div>
              <span>Look for the <strong style={{ color: "#a78bfa" }}>purple shield icon 🛡</strong> in Firefox's address bar (next to the padlock)</span>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", background: "#ffaa00", color: "#000", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0, fontSize: 13 }}>2</div>
              <span>Click it, then click <strong>"Turn off for this site"</strong></span>
            </div>
            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <div style={{ width: 24, height: 24, borderRadius: "50%", background: "#ffaa00", color: "#000", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0, fontSize: 13 }}>3</div>
              <span>Press <kbd style={{ background: "#272727", border: "1px solid #555", borderRadius: 4, padding: "1px 6px", fontFamily: "monospace" }}>F5</kbd> to refresh the page, then search again</span>
            </div>
          </div>
          <div style={{ marginTop: 14, fontSize: 12, color: "#aaa" }}>
            Firefox Enhanced Tracking Protection flagged bsky.app as a tracker. Disabling it for localhost won't affect your privacy elsewhere.
          </div>
        </div>
      )}

      {/* Tip: if no channels or videos, suggest going to channel page directly */}
      {!error && results && actors.length === 0 && videos.length === 0 && (
        <div style={{ background: "#1a2a3a", border: "1px solid #1c62b9", borderRadius: 8, padding: "12px 16px", marginBottom: 20, color: "#aaa", fontSize: 14, lineHeight: 1.6 }}>
          💡 <strong style={{ color: "#f1f1f1" }}>Can't find your channel?</strong> Try searching your exact Bluesky handle (e.g. <code style={{ color: "#3ea6ff", background: "#0a1a2a", padding: "1px 5px", borderRadius: 3 }}>yourname.bsky.social</code>).
          {" "}Bluesky's video index is limited — many video posts may not show in search results.
        </div>
      )}

      {/* Channels */}
      {(filter === "All" || filter === "Channels") && actors.length > 0 && (
        <div style={{ marginBottom: 32 }}>
          <h3 style={{ color: "#f1f1f1", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>Channels</h3>
          {actors.slice(0, filter === "Channels" ? 20 : 5).map((a, i) => (
            <div key={i} onClick={() => onChannel(a.handle)}

                <div style={{ color: "#f1f1f1", fontWeight: 500, fontSize: 15 }}>{a.displayName || a.handle}</div>
                <div style={{ color: "#aaa", fontSize: 13, marginTop: 2 }}>@{a.handle} • {fmt(a.followersCount || 0)} followers</div>
                {a.description && (
                  <div style={{ color: "#aaa", fontSize: 13, marginTop: 6, maxWidth: 500 }}>
                    {a.description.slice(0, 120)}{a.description.length > 120 ? "…" : ""}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "flex-end", flexShrink: 0 }}>
                <button onClick={(e) => e.stopPropagation()}
                  style={{ background: "#f1f1f1", border: "none", color: "#0f0f0f", padding: "8px 16px", borderRadius: 20, fontWeight: 600, fontSize: 13 }}>
                  Follow
                </button>
                <button
                  onClick={(e) => { e.stopPropagation(); onChannel(a.handle); }}
                  style={{ background: "none", border: "1px solid #3f3f3f", color: "#3ea6ff", padding: "6px 12px", borderRadius: 20, fontSize: 12 }}>
                  View Channel
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Videos */}
      {(filter === "All" || filter === "Videos") && (
        <div>
          <h3 style={{ color: "#f1f1f1", fontSize: 15, fontWeight: 600, marginBottom: 12 }}>
            Videos{videos.length > 0 ? ` (${videos.length})` : ""}
          </h3>
          {videos.length === 0
            ? <div style={{ color: "#aaa", fontSize: 14, padding: "24px 0" }}>
                No videos found for "{query}".
                {totalPosts > 0 && <span style={{ color: "#555" }}> Found {totalPosts} non-video posts — Bluesky's search index may not include recent video uploads.</span>}
              </div>
            : videos.map((post, i) => <VideoCardCompact key={post.uri || i} post={post} onWatch={onWatch} onChannel={onChannel} />)
          }
        </div>
      )}

      {!loading && !error && results && videos.length === 0 && actors.length === 0 && (
        <div style={{ textAlign: "center", padding: "48px 0", color: "#aaa" }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🔍</div>
          <div style={{ fontSize: 16, marginBottom: 8 }}>No results found</div>
          <div style={{ fontSize: 14, color: "#555" }}>Try a different keyword, or your exact handle like <span style={{ color: "#3ea6ff" }}>yourname.bsky.social</span></div>
        </div>
      )}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [etpBlocked,    setEtpBlocked]    = useState(false);
  const [session,       setSession]       = useState(null);
  const [page,          setPage]          = useState("home");
  const [sidebarOpen,   setSidebarOpen]   = useState(true);
  const [showLogin,     setShowLogin]     = useState(false);
  const [searchInput,   setSearchInput]   = useState("");

  const [homeVideos,    setHomeVideos]    = useState([]);
  const [homeLoading,   setHomeLoading]   = useState(true);
  const [currentVideo,  setCurrentVideo]  = useState(null);
  const [related,       setRelated]       = useState([]);
  const [thread,        setThread]        = useState(null);
  const [channelData,   setChannelData]   = useState(null);
  const [channelVideos, setChannelVideos] = useState([]);
  const [channelLoading,setChannelLoading]= useState(false);
  const [searchQuery,   setSearchQuery]   = useState("");
  const [searchResults, setSearchResults] = useState(null);
  const [searchLoading, setSearchLoading] = useState(false);

  // Load home feed
  const loadHome = useCallback(async (sess) => {
    setHomeLoading(true);
    const seen = new Set();
    const videos = [];
    const add = (posts) => {
      for (const p of (posts || [])) {
        if (p && isVid(p) && !seen.has(p.uri)) { videos.push(p); seen.add(p.uri); }
      }
    };
    try {
      if (sess) {
        const r = await apiFetch(`${AUTH}/app.bsky.feed.getTimeline?limit=100`, { headers: { Authorization: `Bearer ${sess.accessJwt}` } });
        const d = await r.json();
        add((d.feed || []).map((i) => i.post));
      }
      const terms = ["video", "watch", "clip", "vlog", "reel"];
      const batches = await Promise.all(
        terms.map((t) =>
          apiFetch(`${PUB}/app.bsky.feed.searchPosts?q=${encodeURIComponent(t)}&limit=50&sort=latest`)
            .then((r) => r.json()).then((d) => d.posts || []).catch(() => [])
        )
      );
      batches.forEach(add);
      const hotRes = await apiFetch(`${PUB}/app.bsky.feed.getFeed?feed=at://did:plc:z72i7hdynmk6r22z27h6tvur/app.bsky.feed.generator/whats-hot&limit=100`).catch(() => null);
      if (hotRes && hotRes.ok) { const d = await hotRes.json(); add((d.feed || []).map((i) => i.post)); }
    } catch (err) { console.error("loadHome error:", err); if(isETPBlock(err)) setEtpBlocked(true); }
    setHomeVideos(videos);
    setHomeLoading(false);
  }, []);

  useEffect(() => { if (page === "home") loadHome(session); }, [page]);

  const handleWatch = useCallback(async (post) => {
    setCurrentVideo(post);
    setThread(null);
    setRelated([]);
    setPage("watch");
    window.scrollTo(0, 0);
    try {
      const [tRes, fRes] = await Promise.all([
        apiFetch(`${PUB}/app.bsky.feed.getPostThread?uri=${encodeURIComponent(post.uri)}&depth=6`),
        apiFetch(`${PUB}/app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(post.author.did)}&limit=50`),
      ]);
      const tData = await tRes.json();
      const fData = await fRes.json();
      setThread(tData.thread);
      setRelated((fData.feed || []).map((i) => i.post).filter((p) => isVid(p) && p.uri !== post.uri).slice(0, 15));
    } catch (err) { console.error(err); }
  }, []);

  const handleChannel = useCallback(async (actor) => {
    setChannelData(null);
    setChannelVideos([]);
    setChannelLoading(true);
    setPage("channel");
    window.scrollTo(0, 0);
    try {
      const [pRes, fRes] = await Promise.all([
        apiFetch(`${PUB}/app.bsky.actor.getProfile?actor=${encodeURIComponent(actor)}`),
        apiFetch(`${PUB}/app.bsky.feed.getAuthorFeed?actor=${encodeURIComponent(actor)}&limit=100&filter=posts_with_media`),
      ]);
      const profile = await pRes.json();
      const feed    = await fRes.json();
      setChannelData(profile);
      setChannelVideos((feed.feed || []).map((i) => i.post).filter(isVid));
    } catch (err) { console.error(err); }
    setChannelLoading(false);
  }, []);

  const handleSearch = useCallback(async (q) => {
    const raw = q.trim();
    if (!raw) return;

    // Strip leading @ if present
    const stripped = raw.startsWith("@") ? raw.slice(1) : raw;

    // If it looks like a handle (no spaces, contains a dot OR no spaces at all ≤ 30 chars)
    // route directly to the channel page instead of a search
    const looksLikeHandle = !stripped.includes(" ") && (stripped.includes(".") || stripped.length <= 30);

    setSearchQuery(raw);
    setSearchInput(raw);
    setSearchResults(null);
    setSearchLoading(true);
    setPage("search");
    window.scrollTo(0, 0);

    try {
      // Always try actor search and post search in parallel
      const [aRes, pRes] = await Promise.all([
        apiFetch(`${PUB}/app.bsky.actor.searchActors?q=${encodeURIComponent(stripped)}&limit=20`),
        apiFetch(`${PUB}/app.bsky.feed.searchPosts?q=${encodeURIComponent(raw)}&limit=100&sort=latest`),
      ]);

      const aData = aRes.ok ? await aRes.json() : { actors: [] };
      const pData = pRes.ok ? await pRes.json() : { posts: [] };

      let actors = aData.actors || [];
      const allPosts = pData.posts || [];

      // If the query looks like a handle, also try a direct profile lookup
      // so "@rechoraccoon" or "rechoraccoon.bsky.social" always finds the channel
      if (looksLikeHandle) {
        const directRes = await apiFetch(`${PUB}/app.bsky.actor.getProfile?actor=${encodeURIComponent(stripped)}`).catch(() => null);
        if (directRes && directRes.ok) {
          const profile = await directRes.json();
          if (profile && profile.handle) {
            // Prepend the direct match so it appears first
            const alreadyIncluded = actors.some((a) => a.did === profile.did);
            if (!alreadyIncluded) actors = [profile, ...actors];
            else actors = [profile, ...actors.filter((a) => a.did !== profile.did)];
          }
        }
      }

      // Video detection — check both the hydrated view type AND the raw record type
      const hasVideo = (p) => {
        if (!p) return false;
        const e = p.embed;
        if (!e) return false;
        const t = e.$type || "";
        // Hydrated view (what feed/search APIs return)
        if (t === "app.bsky.embed.video#view") return true;
        // Raw record type (occasionally returned by search)
        if (t === "app.bsky.embed.video") return true;
        // Sometimes wrapped in a record+media embed
        if (t === "app.bsky.embed.recordWithMedia#view") {
          const media = e.media;
          if (media && (media.$type === "app.bsky.embed.video#view" || media.$type === "app.bsky.embed.video")) return true;
        }
        return false;
      };

      const videos = allPosts.filter(hasVideo);

      setSearchResults({ videos, actors, totalPosts: allPosts.length, error: null });
    } catch (err) {
      console.error("Search error:", err);
      const etp = isETPBlock(err);
      const msg = etp
        ? "ETP_BLOCK"
        : "Search failed: " + (err.message || String(err));
      setSearchResults({ videos: [], actors: [], totalPosts: 0, error: msg });
    }
    setSearchLoading(false);
  }, []);

  const marginLeft = sidebarOpen ? 240 : 72;

  return (
    <div style={{ minHeight: "100vh", background: "#0f0f0f", color: "#f1f1f1" }}>
      <Header
        onHome={() => { setPage("home"); window.scrollTo(0, 0); }}
        onSearch={handleSearch}
        session={session}
        onLogin={() => setShowLogin(true)}
        onLogout={() => setSession(null)}
        input={searchInput}
        setInput={setSearchInput}
        toggleSidebar={() => setSidebarOpen((o) => !o)}
      />

      <Sidebar
        open={sidebarOpen}
        page={page}
        onHome={() => { setPage("home"); window.scrollTo(0, 0); }}
        onExplore={handleSearch}
        onFeed={() => handleSearch("video")}
        onSubscriptions={() => session ? handleSearch("video") : setShowLogin(true)}
        hasSession={!!session}
      />

      {/* ETP / Network block banner */}
      {etpBlocked && (
        <div style={{
          position: "fixed", top: 56, left: 0, right: 0, zIndex: 150,
          background: "#1a1200", borderBottom: "2px solid #ffaa00",
          padding: "10px 24px", display: "flex", alignItems: "center", gap: 12,
          fontSize: 13, color: "#ffcc44"
        }}>
          <span style={{ fontSize: 18 }}>🛡️</span>
          <div>
            <strong>Firefox Enhanced Tracking Protection is blocking Bluesky.</strong>
            {" "}Click the <strong style={{ color: "#fff" }}>purple shield icon</strong> in the address bar → click <strong style={{ color: "#fff" }}>"Turn off for this site"</strong> → then refresh the page.
          </div>
          <button onClick={() => setEtpBlocked(false)} style={{ marginLeft: "auto", background: "none", border: "none", color: "#ffcc44", fontSize: 18, flexShrink: 0, padding: "0 4px" }}>✕</button>
        </div>
      )}
      <main style={{ marginLeft: marginLeft, marginTop: etpBlocked ? 106 : 56, minHeight: "calc(100vh - 56px)", transition: "margin-left 0.15s ease" }}>
        {page === "home" && (
          <HomePage videos={homeVideos} loading={homeLoading} onWatch={handleWatch} onChannel={handleChannel} onExplore={handleSearch} />
        )}
        {page === "watch" && currentVideo && (
          <WatchPage post={currentVideo} related={related} thread={thread} onWatch={handleWatch} onChannel={handleChannel} />
        )}
        {page === "channel" && (
          <ChannelPage data={channelData} videos={channelVideos} loading={channelLoading} onWatch={handleWatch} onChannel={handleChannel} />
        )}
        {page === "search" && (
          <SearchPage results={searchResults} loading={searchLoading} query={searchQuery} onWatch={handleWatch} onChannel={handleChannel} />
        )}
      </main>

      {showLogin && (
        <LoginModal
          onClose={() => setShowLogin(false)}
          onSuccess={(data) => { setSession(data); setShowLogin(false); loadHome(data); }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
